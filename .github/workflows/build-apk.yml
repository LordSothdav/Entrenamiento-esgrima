name: Compilar y Publicar APK Android

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ created ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar aplicación web y sincronizar con Android
        run: npm run build:android

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Permisos de ejecución para Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Preparar archivo APK final
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Esgrima-Footwork.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Entrenamiento-esgrima.apk
          ls -la android/app/build/outputs/apk/debug/

      - name: Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Esgrima-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publicar Release en GitHub con el APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: latest
          name: "Entrenamiento Esgrima - Versión APK"
          make_latest: true
          body: |
            ### 🤺 Entrenamiento Esgrima para Android
            
            Archivo APK listo para instalar directamente en cualquier teléfono o tablet Android.
            
            **Descarga directa:** Haz clic abajo en `Entrenamiento-esgrima.apk` o `Esgrima-Footwork.apk`.
          files: |
            android/app/build/outputs/apk/debug/Entrenamiento-esgrima.apk
            android/app/build/outputs/apk/debug/Esgrima-Footwork.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
