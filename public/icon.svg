<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#03173d" />
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bg)" stroke="#2563eb" stroke-width="2"/>
  <!-- Crossed Foils -->
  <line x1="20" y1="80" x2="80" y2="20" stroke="url(#blade)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="20" cy="80" r="4" fill="#fbbf24"/>
  <line x1="80" y1="80" x2="20" y2="20" stroke="url(#blade)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="80" cy="80" r="4" fill="#fbbf24"/>
  <!-- Fencing Mask -->
  <ellipse cx="50" cy="50" rx="18" ry="24" fill="#1e293b" stroke="#f8fafc" stroke-width="2.5"/>
  <ellipse cx="50" cy="48" rx="14" ry="19" fill="#0f172a" stroke="#3b82f6" stroke-width="1" stroke-dasharray="2 2"/>
  <!-- Mask Collar / Bib -->
  <path d="M 36 68 Q 50 82 64 68 Z" fill="#3b82f6" stroke="#93c5fd" stroke-width="1.5"/>
</svg>
